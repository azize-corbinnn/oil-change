workflows:
  expo-android-apk:
    name: Build Expo APK

    max_build_duration: 60

    environment:
      node: 20

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install EAS CLI
        script: npm install -g eas-cli

      - name: Check Expo Login
        script: eas whoami

      - name: Build APK
        script: eas build --platform android --profile preview --non-interactive

    artifacts:
      - "*.apk"
