workflows:
  expo-android-apk:
    name: Build Expo APK

    environment:
      node: 20
      groups:
        - expo

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install EAS
        script: npm install -g eas-cli

      - name: Check Expo Login
        script: eas whoami

      - name: Build APK
        script: eas build --platform android --profile preview --non-interactive

    artifacts:
      - "*.apk"
