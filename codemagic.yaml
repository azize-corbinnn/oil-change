workflows:
  expo-android-apk:
    name: Build Expo APK

    max_build_duration: 60

    environment:
      node: 20

    scripts:
      - npm install
      - npm install -g eas-cli
      - echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
      - eas whoami
      - eas build --platform android --profile preview --non-interactive

    artifacts:
      - "*.apk"
